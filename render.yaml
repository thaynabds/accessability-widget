# Blueprint do Render para a API do AccessAbility Widget (api/).
# Caminhos relativos à raiz do repositório.
services:
  - type: web
    name: accessability-widget-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /v3/api-docs
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://thaynabds.github.io"
